# Runs the browser tier — Playwright over the gallery in a real Chromium — and sends the pages it
# archives to Chromatic. This is the one workflow that holds a secret and the one that reaches the
# network, because `check.yml` promises neither. What gets uploaded is the redacted fixture corpus
# rendered as pages: the gallery builds its own store and cannot be pointed at a real one, which
# is what makes sending these to a third party acceptable at all.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

# Read-only. The token below is the only credential in the file, and `tests/tools/test_workflows.py`
# is what keeps it the only one in the directory.
permissions:
  contents: read

# One build per pull request at a time. GitHub starts a run for this workflow whenever the branch
# moves *or* its base does, so a rebased stack lands two runs on one commit within a second of each
# other — and two Chromatic builds of one commit ask for the same changes to be accepted twice. A
# push to main is never cancelled: it is where the baseline every branch measures against comes from.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      # Full history: Chromatic finds a build's baseline by walking back through the commits this
      # one descends from, and the default one-commit checkout leaves it nothing to walk.
      #
      # And the branch's own tip rather than the default: on a `pull_request` event that default
      # is a merge of the branch into whatever main is at that moment, built for the run and thrown
      # away. Snapshots taken from it are the merge's, filed under the branch commit below — so the
      # same commit renders differently every time the base moves, and the changes accepted on one
      # run come back on the next. Empty on a push, where the default is already the commit that
      # ran. `check.yml` still runs on the merge, which is where a merge's own breakage shows up.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # Installs every tool `mise.toml` pins and caches them between runs.
      - uses: jdx/mise-action@v4
      - run: mise run sync
      # The npm packages and the browser. Separate from the sweep so a failure here reads as one.
      - run: mise run e2e-deps
      # ...and the system libraries Chromium links against, which a runner does not ship and
      # `playwright install` alone does not fetch. Linux-only, so it stays out of `e2e-deps`.
      - run: mise exec -- npx playwright install-deps chromium
        working-directory: tests/e2e
      - run: mise run e2e
      # The upload, and the only step that needs the token. A fork's pull request is not given
      # one, so it runs everything above and stops here rather than failing on a secret it was
      # never going to have. A push to main carries no pull request to read, hence the first
      # clause — and main is where a baseline every later build is measured against comes from.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: mise run e2e-chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # What `chromaui/action` would tell the CLI about this commit, which a bare `npx
          # chromatic` never says for itself: left alone it files the build under `GITHUB_SHA`,
          # the merge preview no later build descends from, so the next build finds no baseline
          # and every page reads as new. The four together name the branch tip the step above
          # checked out, the branch and repository it came from, and the merge GitHub built the
          # run for. Each reads empty on a push — the CLI's own reading is already right there —
          # and empty turns the override off, exactly as leaving it unset would.
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha }}
          CHROMATIC_BRANCH: ${{ github.head_ref }}
          CHROMATIC_SLUG: ${{ github.event.pull_request.head.repo.full_name }}
          CHROMATIC_PULL_REQUEST_SHA: ${{ github.sha }}
